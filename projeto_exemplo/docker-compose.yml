name: cassandra-pb

volumes:
  cassandra_data:

services:
  apache_cassandra:
      container_name: cassandra-pb
      image: cassandra:5.0
      environment:
        CASSANDRA_CLUSTER_NAME: pb-cluster
        CASSANDRA_DC: datacenter1
        CASSANDRA_USER: cassandra
        CASSANDRA_PASSWORD: cassandra
      ports:
        - '9042:9042'
      volumes:
        - cassandra_data:/var/lib/cassandra
      healthcheck:
        test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' >/dev/null 2>&1 || exit 1"]
        interval: 10s
        timeout: 10s
        retries: 30
        start_period: 60s

